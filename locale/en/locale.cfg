[mod-name]
biterAwareBotPathing=Biter Aware Bot Pathing

[mod-description]
biterAwareBotPathing=Evaluates construction, deconstruction, and upgrade work against biter threats and a safe roboport frontier without hiding your planned blueprint ghosts.

[babp-command-help]
recheck=Rebuild threat and network caches, then reevaluate deferred construction, deconstruction, and upgrade tasks.
dump-state=Write the current threat areas, safe roboport frontier data, deferred jobs, and watched ghosts to script-output as JSON.
clear-deferred=Drop hidden deferred jobs in the selected scope so they will not be restored later.
smoke-setup=Create a deterministic L-shaped test base with roboports, enemies, and marked construction jobs for debug checks.
testmap-setup=Recreate the dedicated right-angle biter test map on babp-test-map and try to teleport you there.

[babp-message]
recheck-finished=Rechecked __1__ network area(s).
dump-written=Wrote debug state to __1__.
clear-deferred-finished=Cleared __1__ deferred job(s).
smoke-ready=Smoke lab created on __1__ at __2__.
testmap-ready-player=Test map recreated on __1__ at __2__. You were teleported there. Summary written to script-output/__3__.
testmap-ready-player-warning=Test map recreated on __1__ at __2__. You were not teleported there, so you may need to travel there manually. Summary written to script-output/__3__.
testmap-ready-console=Test map recreated on __1__ at __2__. Summary written to script-output/__3__.
