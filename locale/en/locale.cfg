[mod-name]
biterAwareBotPathing=Biter Aware Bot Pathing

[mod-description]
biterAwareBotPathing=Keeps construction bots from taking unsafe flights over biter nests and outside your defenses by deferring risky jobs and releasing them step by step through a safe roboport frontier.

[babp-command-help]
recheck=Rebuild threat and network caches, then reevaluate deferred construction, deconstruction, and upgrade tasks.
dump-state=Write the current threat areas, safe roboport frontier data, deferred jobs, and watched ghosts to script-output as JSON.
smoke-setup=Create a deterministic L-shaped test base with safe, frontier, and blocked bot jobs for debug checks.

[babp-message]
recheck-finished=Rechecked __1__ network area(s).
dump-written=Wrote debug state to __1__.
smoke-ready=Smoke lab created on __1__ at __2__.
